[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-universe"
dynamic = ["version"]
authors = [
    {name = "Louis Van Langendonck", email = "louis.van.langendonck@upc.edu"}
]
readme = "README.md"
description = "A library for generating synthetic graph datasets with community structure for graph neural network research"
license = {file = "LICENSE"}
keywords = ["graph", "neural-networks", "pytorch", "graph-generation", "community-detection", "synthetic-data"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">= 3.10"
dependencies=[
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Visualization and UI tools
viz = [
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
]


# Notebook support
notebook = [
    "ipykernel>=6.0.0",
    "notebook>=6.5.0",
    "jupyterlab>=3.6.0",
]

# Documentation
doc = [
    "jupyter>=1.0.0",
    "nbsphinx>=0.9.0",
    "nbsphinx_link>=1.3.0",
    "numpydoc>=1.5.0",
    "sphinx>=5.0.0",
    "sphinx_gallery>=0.13.0",
    "pydata-sphinx-theme>=0.13.0",
    "myst_parser>=1.0.0"
]

# Linting and formatting
lint = [
    "pre-commit>=3.0.0",
    "ruff>=0.1.0"
]

# Testing
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "pytest-mock>=3.10.0"
]

# Development (includes test and lint)
dev = ["graph-universe[test,lint,viz,notebook]"]

# Everything
all = ["graph-universe[dev,doc]"]

[project.urls]
Repository = "https://github.com/LouisVanLangendonck/GraphUniverse"

[project.scripts]
graph-universe-ui = "graph_universe.cli:main"

[tool.setuptools.dynamic]
version = {attr = "graph_universe.__version__"}

[tool.setuptools.package-data]
graph_universe = ["streamlit_app.py"]

[tool.setuptools.packages.find]
include = [
    "graph_universe",
    "graph_universe.*"
]

[tool.coverage.run]
source = ["graph_universe"]
omit = ["*/test/*", "*/__pycache__/*", "*/viz_utils.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"

# ============================================================
# Ruff Configuration
# ============================================================

[tool.ruff]
# Maximum line length (matches Black default)
line-length = 100

# Python version for compatibility
target-version = "py310"

# Directories to exclude from linting
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",     # pycodestyle errors (PEP 8 violations)
    "W",     # pycodestyle warnings
    "F",     # pyflakes (undefined names, unused imports)
    "I",     # isort (import sorting)
    "N",     # pep8-naming (naming conventions)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear (likely bugs)
    "C4",    # flake8-comprehensions (better comprehensions)
    "SIM",   # flake8-simplify (simplification suggestions)
    "NPY",   # numpy-specific rules
    "RUF",   # ruff-specific rules
]

# Rules to ignore
ignore = [
    "E501",   # Line too long (let formatter handle this)
    "B008",   # Function call in default argument (common in ML)
    "N803",   # Argument name should be lowercase (for math: K, P, etc.)
    "N806",   # Variable in function should be lowercase (for math)
    "SIM108", # Use ternary operator (sometimes less readable)
    "NPY002", # Using np.random.Generator instead of np.random.seed and no.random.Uniform etc.
    "N999",  # Invalid module name
]

# Allow specific violations in specific files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Unused import (OK in __init__.py for re-exports)
    "F403",  # Star import (sometimes needed)
]
"test_*.py" = [
    "N802",  # Function name should be lowercase (test_ClassName is OK)
    "N806",  # Variable should be lowercase (OK in tests)
    "B011",  # Assert false (used in tests)
]

# Specific rule configurations
[tool.ruff.lint.isort]
known-first-party = ["graph_universe"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pep8-naming]
# Allow mathematical variable names
extend-ignore-names = ["K", "P", "N", "X", "Y"]

[tool.ruff.format]
# Use double quotes (default)
quote-style = "double"

# Use spaces for indentation
indent-style = "space"

# Respect magic trailing comma (keeps multi-line formatting)
skip-magic-trailing-comma = false
